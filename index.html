    // THREE JS SETUP
    // =====================================

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('spiral'),
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.z = 8;

    const cardCount = processedImages.length * 2;

    const geometry = new THREE.PlaneGeometry(
      settings.cardWidth,
      settings.cardHeight,
      1,
      16
    );

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    const wobble = { value: 0 };

    // =====================================
    // LOAD IMAGES
    // =====================================

    let loadedCount = 0;
    let failedCount = 0;

    const textures = processedImages.map((url, index) => {

      const texture = textureLoader.load(
        url,

        () => {
          loadedCount++;
          console.log(`Loaded: ${loadedCount}/${processedImages.length}`);
        },

        undefined,

        (error) => {
          failedCount++;
          console.error(`Failed image ${index + 1}:`, url, error);
        }
      );

      texture.colorSpace = THREE.SRGBColorSpace;

      return texture;
    });

    // Duplicate textures for spiral arrangement

    const allTextures = textures.concat(textures);

    const cards = allTextures.map((texture) => {

      const card = new THREE.Mesh(
        geometry,

        new THREE.ShaderMaterial({
          vertexShader,
          fragmentShader,
          side: THREE.DoubleSide,

          uniforms: {
            uTexture: { value: texture },
            uWobble: wobble,
          },
        })
      );

      scene.add(card);

      return card;
    });

    console.log("Total Images:", processedImages.length);
    console.log("Total Spiral Cards:", cards.length);

    // =====================================
    // SCROLL & ANIMATION
    // =====================================

    const state = {
      rotation: 0,
      rotationTarget: 0
    };

    Observer.create({
      target: window,
      type: 'wheel,touch',
      preventDefault: true,

      onChange: (self) => {
        state.rotationTarget += self.deltaY * settings.scrollSensitivity;
      },
    });

    gsap.ticker.add(() => {

      state.rotationTarget += settings.idleSpin;

      state.rotation +=
        (state.rotationTarget - state.rotation) * settings.smoothing;

      const lag = gsap.utils.clamp(
        -1,
        1,
        state.rotationTarget - state.rotation
      );

      wobble.value +=
        (lag * settings.wobbleStrength - wobble.value) *
        settings.smoothing;

      cards.forEach((card, index) => {

        const slot =
          gsap.utils.wrap(0, cardCount, index - state.rotation) -
          cardCount / 2;

        const angle = slot * settings.angleGap + Math.PI / 2;

        card.position.set(
          Math.cos(angle) * settings.radius,
          slot * settings.verticalGap,
          Math.sin(angle) * settings.radius
        );

        card.rotation.y = Math.PI / 2 - angle;
      });

      renderer.render(scene, camera);
    });

    // =====================================
    // RESPONSIVE RESIZE
    // =====================================

    function resize() {

      camera.aspect = innerWidth / innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(innerWidth, innerHeight, false);
    }

    resize();

    addEventListener('resize', resize);

  </script>

</body>
</html>
