  <title>Beyond Classroom — 3D Spiral Archive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #08080a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --mouse-x: 50vw;
      --mouse-y: 50vh;
    }

    /* Ambient Interactive Radial Glow */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle 750px at var(--mouse-x) var(--mouse-y), rgba(88, 101, 242, 0.18), rgba(168, 85, 247, 0.09), transparent 70%);
      z-index: 0;
      transition: background 0.15s ease-out;
    }

    /* Subtle Cinematic Film Grain */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 2;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      position: relative;
      z-index: 1;
    }

    /* Luxury Minimal UI Overlay */
    .ui-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
    }

    .ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tag-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
    }

    .status-badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    .ui-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-hint {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .nav-hint svg {
      opacity: 0.7;
    }

    .counter-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 640px) {
      .ui-container {
        padding: 18px 20px;
      }

      .brand-title {
        font-size: 11px;
      }

      .status-badge {
        display: none;
      }

      .nav-hint {
        font-size: 10px;
        padding: 6px 12px;
      }
    }
  </style>

      a154: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890730/20260321_163027_result.jpg",

      a156: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890729/20260215_213445_result.jpg",
      a157: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890728/20260203_172645_result.jpg",
      a158: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890728/20260208_202807_result.jpg",
      a159: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890727/20260203_172453_result.jpg",
      a160: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890726/20260203_170711_result.jpg",
      a161: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890726/20260203_171112_result.jpg",
      a162: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890726/20260203_172034_result.jpg",
      a163: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890726/20260203_172255_result.jpg",
      a164: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890726/20260203_170542_result.jpg",
      a165: "https://res.cloudinary.com/v4qwfqix/image/upload/v1793890726/20260203_172218_result.jpg",

      // Add more URLs using commas
    }

    const processedImages = Object.values(imageUrls)
      .filter(url => typeof url === "string" && url.startsWith("https://"))
      ;

    console.log("Total Images:", processedImages.length);
    console.log("First Image:", processedImages[0]);

    // =====================================
    // SETTINGS
    // =====================================

    const settings = {
      radius: 1.85,
      verticalGap: 0.9,
      angleGap: 0.85,
      cardWidth: 1.35,
      cardHeight: 1.8,
      cardRadius: 0.08, // Rounded corners radius
      idleSpin: 0.004,
      scrollSensitivity: 0.004,
      smoothing: 0.09,
      wobbleStrength: 0.28,
      brightness: 1.18, // Brightness boost for dark luxury mode
      contrast: 1.08,   // Punchy contrast
    };

    const vertexShader = `
      uniform float uWobble;
      varying vec2 vUv;
      varying float vDepth;

      void main() {
        vUv = uv;

        vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);

        viewPosition.x += sin(uv.y * 3.14159) * uWobble;

        vDepth = -viewPosition.z;

        gl_Position = projectionMatrix * viewPosition;
      }
    `;

    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform float uBrightness;
      uniform float uContrast;
      uniform vec2 uCardSize;
      uniform float uRadius;
      varying vec2 vUv;
      varying float vDepth;

      // Signed distance function for rounded rectangle
      float roundedBoxSDF(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
      }

      void main() {
        // Calculate rounded corner distance
        vec2 p = (vUv - 0.5) * uCardSize;
        vec2 halfSize = uCardSize * 0.5;
        float dist = roundedBoxSDF(p, halfSize, uRadius);

        // Discard pixels outside rounded boundary
        if (dist > 0.0) discard;

        vec4 color = texture2D(uTexture, vUv);

        // 1. Gamma Correction (Fixes the dark/blackish color crush)
        color.rgb = pow(color.rgb, vec3(1.0 / 2.2));

        // 2. Contrast & Clarity enhancement
        color.rgb = (color.rgb - 0.5) * uContrast + 0.5;

        // 3. Brightness boost
        color.rgb *= uBrightness;

        // 4. Subtle Luxury Border Rim Light
        float rim = smoothstep(0.0, -0.012, dist) - smoothstep(-0.012, -0.024, dist);
        color.rgb += vec3(rim * 0.32);

        // 5. Backface Styling (Matte Charcoal luxury look)
        if (!gl_FrontFacing) {
          color.rgb = mix(color.rgb * 0.25, vec3(0.05, 0.06, 0.08), 0.88);
        }

        // 6. Atmospheric Depth Fog (fades distant back cards smoothly into darkness)
        float fog = smoothstep(4.5, 13.5, vDepth);
        color.rgb = mix(color.rgb, vec3(0.031, 0.031, 0.039), fog * 0.82);

        gl_FragColor = vec4(clamp(color.rgb, 0.0, 1.0), 1.0);
      }
    `;

    // =====================================
    // THREE JS SETUP
    // =====================================

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('spiral'),
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.z = 8;

    const cardCount = processedImages.length * 2;

    const geometry = new THREE.PlaneGeometry(
      settings.cardWidth,
      settings.cardHeight,
      1,
      16
    );

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    const wobble = { value: 0 };

    // =====================================
    // LOAD IMAGES
    // =====================================

    let loadedCount = 0;
    let failedCount = 0;

    const textures = processedImages.map((url, index) => {

      const texture = textureLoader.load(
        url,

        () => {
          loadedCount++;
          console.log(`Loaded: ${loadedCount}/${processedImages.length}`);
        },

        undefined,

        (error) => {
          failedCount++;
          console.error(`Failed image ${index + 1}:`, url, error);
        }
      );

      texture.colorSpace = THREE.SRGBColorSpace;

      return texture;
    });

    // =====================================
    // FLOATING 3D PARTICLES (DUST & GLOW)
    // =====================================

    const particleCount = 280;
    const particleGeometry = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 18;
      particlePositions[i + 1] = (Math.random() - 0.5) * 24;
      particlePositions[i + 2] = (Math.random() - 0.5) * 14;
    }

    particleGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(particlePositions, 3)
    );

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.04,
      color: 0x93a5ff,
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending,
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // =====================================
    // BUILD SPIRAL CARDS
    // =====================================

    const uCardSize = new THREE.Vector2(settings.cardWidth, settings.cardHeight);

    // Duplicate textures for continuous spiral loop
    const allTextures = textures.concat(textures);

    const cards = allTextures.map((texture) => {
      const card = new THREE.Mesh(
        geometry,
        new THREE.ShaderMaterial({
          vertexShader,
          fragmentShader,
          side: THREE.DoubleSide,
          transparent: true,
          uniforms: {
            uTexture: { value: texture },
            uWobble: wobble,
            uBrightness: { value: settings.brightness },
            uContrast: { value: settings.contrast },
            uCardSize: { value: uCardSize },
            uRadius: { value: settings.cardRadius },
          },
        })
      );

      scene.add(card);
      return card;
    });

    console.log("Total Images:", processedImages.length);
    console.log("Total Spiral Cards:", cards.length);

    // =====================================
    // MOUSE PARALLAX & AMBIENT GLOW
    // =====================================

    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
    const counterEl = document.getElementById('photoCounter');

    window.addEventListener('pointermove', (e) => {
      mouse.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.targetY = (e.clientY / window.innerHeight - 0.5) * 2;

      document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
      document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
    });

    // =====================================
    // SCROLL & ANIMATION LOOP
    // =====================================

    const state = {
      rotation: 0,
      rotationTarget: 0
    };

    Observer.create({
      target: window,
      type: 'wheel,touch',
      preventDefault: true,
      onChange: (self) => {
        state.rotationTarget += self.deltaY * settings.scrollSensitivity;
      },
    });

    gsap.ticker.add(() => {
      state.rotationTarget += settings.idleSpin;
      state.rotation += (state.rotationTarget - state.rotation) * settings.smoothing;

      const wobbleLag = gsap.utils.clamp(-1, 1, state.rotationTarget - state.rotation);
      wobble.value += (wobbleLag * settings.wobbleStrength - wobble.value) * settings.smoothing;

      // Smooth Mouse Parallax
      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      camera.position.x = mouse.x * 0.65;
      camera.position.y = -mouse.y * 0.42;
      camera.lookAt(0, 0, 0);

      // Subtle particle rotation
      particles.rotation.y += 0.0006;
      particles.rotation.x += 0.0002;

      cards.forEach((card, index) => {
        const slot =
          gsap.utils.wrap(0, cardCount, index - state.rotation) -
          cardCount / 2;

        const angle = slot * settings.angleGap + Math.PI / 2;

        card.position.set(
          Math.cos(angle) * settings.radius,
          slot * settings.verticalGap,
          Math.sin(angle) * settings.radius
        );

        card.rotation.y = Math.PI / 2 - angle;
      });

      // Update active photo counter in UI
      if (counterEl && processedImages.length > 0) {
        const currentActive = (Math.round(gsap.utils.wrap(0, cardCount, state.rotation)) % processedImages.length) + 1;
        counterEl.textContent = `${String(currentActive).padStart(3, '0')} / ${String(processedImages.length).padStart(3, '0')}`;
      }

      renderer.render(scene, camera);
    });

    // =====================================
    // RESPONSIVE RESIZE
    // =====================================

    function resize() {

      camera.aspect = innerWidth / innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(innerWidth, innerHeight, false);
    }

    resize();

    addEventListener('resize', resize);

  </script>
